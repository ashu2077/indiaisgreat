<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .era-nav { display: flex; gap: 6px; flex-wrap: wrap; }
  .era-btn { font-size: 12px; color: var(--text-secondary); background: var(--surface-1);
    border: 0.5px solid var(--border); border-radius: 20px; padding: 4px 12px; cursor: pointer;
    transition: background 0.15s; white-space: nowrap; }
  .era-btn:hover { background: var(--surface-2); color: var(--text-primary); }
  .era-btn.active { background: var(--text-primary); color: var(--surface-2); border-color: var(--text-primary); }

  .filter-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .filter-label { font-size: 11px; color: var(--text-muted); margin-right: 2px; }
  .cat-btn { font-size: 11px; border-radius: 20px; padding: 3px 10px; cursor: pointer;
    transition: opacity 0.15s; border: 1.5px solid transparent; white-space: nowrap; font-weight: 500; }
  .cat-btn.off { opacity: 0.3; }

  .legend { display: flex; gap: 12px; flex-wrap: wrap; padding: 4px 16px 10px; }
  .legend span { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-secondary); }
  .ld { width: 9px; height: 9px; transform: rotate(45deg); display: inline-block; flex-shrink: 0; border-radius: 1px; }

  .era-header { font-size: 10px; font-weight: 500; letter-spacing: 0.08em; color: var(--text-muted);
    text-transform: uppercase; padding: 16px 16px 4px; border-top: 0.5px solid var(--border); margin-top: 4px; }
  .era-header:first-child { border-top: none; margin-top: 0; }

  .tl-row { display: flex; align-items: stretch; min-height: 64px; }
  .tl-label { width: 220px; min-width: 220px; padding: 10px 14px; display: flex; flex-direction: column; justify-content: center; }
  .tl-label-left  { text-align: right; padding-right: 16px; }
  .tl-label-right { text-align: left;  padding-left: 16px; }
  .tl-center { width: 40px; min-width: 40px; display: flex; flex-direction: column; align-items: center; }
  .tl-line { width: 2px; background: var(--border); flex: 1; }
  .tl-diamond { width: 13px; height: 13px; transform: rotate(45deg); border-radius: 1px; flex-shrink: 0;
    z-index: 1; box-shadow: 0 0 0 2.5px var(--surface-0); }

  .pm-row { display: flex; align-items: stretch; min-height: 60px; }
  .pm-label { width: 220px; min-width: 220px; padding: 8px 14px; display: flex; flex-direction: column; justify-content: center; }
  .pm-label-left  { text-align: right; padding-right: 16px; }
  .pm-label-right { text-align: left;  padding-left: 16px; }
  .pm-center { width: 40px; min-width: 40px; display: flex; flex-direction: column; align-items: center; }
  .pm-icon { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0; z-index:1; overflow: hidden;
    box-shadow: 0 0 0 2.5px var(--surface-0); border: 1.5px solid #888; }
  .pm-name { font-size: 13px; font-weight: 500; color: var(--text-primary); line-height: 1.3; }
  .pm-term { font-size: 11px; color: var(--text-muted); line-height: 1.3; margin-top: 2px; }
  .pm-party { font-size: 10px; color: var(--text-secondary); line-height: 1.3; margin-top: 1px; font-style: italic; }
  .pm-badge { display: inline-block; font-size: 10px; padding: 1px 8px; border-radius: 10px;
    margin-top: 4px; font-weight: 500; background:#EAF3DE; color:#27500A; }

  .ev-year  { font-size: 10px; color: var(--text-muted); line-height: 1.3; }
  .ev-title { font-size: 13px; font-weight: 500; color: var(--text-primary); line-height: 1.35; margin-top: 1px; }
  .ev-desc  { font-size: 11px; color: var(--text-secondary); line-height: 1.45; margin-top: 3px; }
  .ev-cat   { display: inline-block; font-size: 10px; padding: 1px 8px; border-radius: 10px;

  { key:"independence", label:"Independence era — 1947 to 1970" },
  { key:"modern",       label:"Modern India — 1971 to 2000" },
  { key:"recent",       label:"Recent era — 2001 to 2026" },
];

let activeEra = "all";
let activeCats = new Set(["war","ind","pol","tech","econ","treaty","pm"]);

function makePMRow(pm, isLeft) {
  const row = document.createElement("div");
  row.className = "pm-row";

  const left  = document.createElement("div");
  left.className  = "pm-label pm-label-left";
  const right = document.createElement("div");
  right.className = "pm-label pm-label-right";

  const card = document.createElement("div");
  card.innerHTML = `
    <div class="pm-name">${pm.name}</div>
    <div class="pm-term">${pm.term}</div>
    <div class="pm-party">${pm.party}</div>
    <span class="pm-badge">Prime Minister</span>
  `;
  if (isLeft) left.appendChild(card);
  else right.appendChild(card);

  const center = document.createElement("div");
  center.className = "pm-center";
  const lt = document.createElement("div"); lt.className = "tl-line";
  const icon = document.createElement("div");
  icon.className = "pm-icon";
  icon.innerHTML = FLAG_SVG;
  const lb = document.createElement("div"); lb.className = "tl-line";
  center.append(lt, icon, lb);

  row.append(left, center, right);
  return row;
}

function makeEventRow(ev, isLeft) {
  const row = document.createElement("div");
  row.className = "tl-row";
  const color = CAT_COLOR[ev.cat];

  const left  = document.createElement("div");
  left.className  = "tl-label tl-label-left";
  const right = document.createElement("div");
  right.className = "tl-label tl-label-right";

  const card = document.createElement("div");
  card.innerHTML = `
    <div class="ev-year">${ev.year}</div>
    <div class="ev-title">${ev.title}</div>
    <div class="ev-desc">${ev.desc}</div>
    <span class="ev-cat" style="background:${CAT_BG[ev.cat]};color:${CAT_TXT[ev.cat]}">${CAT_LABEL[ev.cat]}</span>
  `;
  if (isLeft) left.appendChild(card);
  else right.appendChild(card);

  const center = document.createElement("div");
  center.className = "tl-center";
  const lt = document.createElement("div"); lt.className = "tl-line";
  const dm = document.createElement("div"); dm.className = "tl-diamond";
  dm.style.background = color;
  const lb = document.createElement("div"); lb.className = "tl-line";
  center.append(lt, dm, lb);

  row.append(left, center, right);
  return row;
}

function render() {
  const tl = document.getElementById("timeline");
  tl.innerHTML = "";

  const eraKeys = activeEra === "all" ? eras.map(e => e.key) : [activeEra];

  eraKeys.forEach(eKey => {
    const eraEvs   = events.filter(e => e.era === eKey && activeCats.has(e.cat));
    const eraPMs   = activeCats.has("pm") ? pms.filter(p => p.era === eKey) : [];
    if (!eraEvs.length && !eraPMs.length) return;

    const combined = [
      ...eraEvs.map(e => ({ ...e, _type:"event" })),
      ...eraPMs.map(p => ({ ...p, year: p.year, _type:"pm" })),
    ].sort((a, b) => a.year - b.year);

    if (!combined.length) return;

    const eraInfo = eras.find(e => e.key === eKey);
    const hdr = document.createElement("div");
    hdr.className = "era-header";
    hdr.textContent = eraInfo.label;
    tl.appendChild(hdr);

    combined.forEach((item, i) => {
      const isLeft = i % 2 === 0;
      if (item._type === "pm") {
        tl.appendChild(makePMRow(item, isLeft));
      } else {
        tl.appendChild(makeEventRow(item, isLeft));
      }
    });
  });

  if (!tl.children.length) {
    const msg = document.createElement("div");
    msg.style.cssText = "padding:24px 16px;font-size:13px;color:var(--text-muted);text-align:center;";
    msg.textContent = "No events match the current filters.";
    tl.appendChild(msg);
  }
}

document.getElementById("era-nav").addEventListener("click", e => {
  const btn = e.target.closest(".era-btn");
  if (!btn) return;
  document.querySelectorAll(".era-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  activeEra = btn.dataset.era;
  render();
});

document.querySelector(".filter-row").addEventListener("click", e => {
  const btn = e.target.closest(".cat-btn");
  if (!btn) return;
  const cat = btn.dataset.cat;
  if (activeCats.has(cat)) {
    if (activeCats.size === 1) return;
    activeCats.delete(cat);
    btn.classList.add("off");
  } else {
    activeCats.add(cat);
    btn.classList.remove("off");
  }
  render();
});

render();
</script>
</body>
</html>
